
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/assets/firc.png.avif" type="image/svg+xml">
    <link rel="stylesheet" href="/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="/css/cs.css">

    <title>Shopping Cart | Fricshop</title>

    <style>
        /* Floating Cart */
        .floating-cart {
            position: fixed;
            right: 30px;
            bottom: 30px;
            width: 60px;
            height: 60px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            text-decoration: none;
            transition: 0.3s;
        }

        .floating-cart:hover {
            transform: scale(1.1);
            background-color: #eeeeee;
        }
    </style>

</head>

<body>

    <div class="container mt-5">

        <h1 class="mb-4">YOUR CART</h1>

        <div id="cartItems"></div>

        <div class="mt-4">
            <h3>Total: $<span id="cartTotal">0.00</span></h3>
        </div>

    <div class="mt-4">
    <a href="/shop" class="btn btn-outline-dark">Continue Shopping</a>

    <a href="/checkout.html" class="btn btn-dark ms-2">
        Checkout
    </a>
</div>
    <!-- FLOATING CART ICON -->
    <a href="/cart.html" class="floating-cart" aria-label="Shopping Cart">

        <svg xmlns="http://www.w3.org/2000/svg"
            width="30"
            height="30"
            viewBox="0 0 24 24"
            fill="none"
            stroke="black"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">

            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>

        </svg>

    </a>

    <script src="/js/cart.js"></script>

</body>
</html>
