
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/assets/firc.png.avif" type="image/svg+xml">
    <link rel="stylesheet" href="/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="/css/cs.css">

    <title>Checkout | Fricshop</title>
</head>

<body>

    <div class="container mt-5 mb-5">

        <h1 class="mb-4">CHECKOUT</h1>

        <div class="row">

            <!-- SHIPPING INFORMATION -->
            <div class="col-md-7">

                <h4 class="mb-3">Shipping Information</h4>

                <form id="checkoutForm">

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input
                            type="text"
                            class="form-control"
                            id="customerName"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input
                            type="email"
                            class="form-control"
                            id="customerEmail"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input
                            type="tel"
                            class="form-control"
                            id="customerPhone"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Shipping Address</label>
                        <textarea
                            class="form-control"
                            id="shippingAddress"
                            rows="4"
                            required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Order Note (Optional)</label>
                        <textarea
                            class="form-control"
                            id="orderNote"
                            rows="2"></textarea>
                    </div>

                </form>

            </div>

            <!-- ORDER SUMMARY -->
            <div class="col-md-5">

                <h4 class="mb-3">Your Order</h4>

                <div id="checkoutItems" class="border rounded p-3">
                    Loading order...
                </div>

                <hr>

                <h5>
                    Total: $<span id="checkoutTotal">0.00</span>
                </h5>

                <button
                    type="submit"
                    form="checkoutForm"
                    class="btn btn-dark w-100 mt-3">
                    Place Order
                </button>

                <a href="/cart.html"
                    class="btn btn-outline-dark w-100 mt-2">
                    Back to Cart
                </a>

            </div>

        </div>

    </div>

    <script src="/js/checkout.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
